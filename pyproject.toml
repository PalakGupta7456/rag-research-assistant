[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-research-assistant"
version = "1.0.0"
description = "Hybrid-retrieval RAG over the latest arXiv ML papers, with evaluation"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "requests>=2.31",
  "feedparser>=6.0",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
ml = ["torch>=2.3", "sentence-transformers>=3.0"]
llm = ["anthropic>=0.40"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
